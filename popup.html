<!DOCTYPE html>
<html>
<head>
  <title>FormBot</title>
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      background-color: #4285f4;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #357ae8;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: default;
    }
    .settings-link {
      margin-top: 10px;
      text-align: center;
    }
    #status {
      margin-top: 10px;
      padding: 5px;
      border-radius: 4px;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
    .info {
      background-color: #e8f0fe;
      color: #0c5460;
    }
    .session-info {
      background-color: #f8f9fa;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #e0e0e0;
      margin-top: 10px;
      font-size: 12px;
    }
    .session-field {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }
    .session-field-label {
      font-weight: bold;
    }
    .no-session {
      font-style: italic;
      color: #666;
    }
    .session-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
    }
    .small-button {
      font-size: 11px;
      padding: 3px 6px;
    }
    .separator {
      border-top: 1px solid #e0e0e0;
      margin: 10px 0;
    }
    .tabs {
      display: flex;
      margin-bottom: 10px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 5px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab.active {
      border-bottom: 2px solid #4285f4;
      font-weight: bold;
      color: #4285f4;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>FormBot</h2>

    <div class="tabs">
      <div class="tab active" id="tab-forms">Forms</div>
      <div class="tab" id="tab-session">Session</div>
    </div>

    <div class="tab-content active" id="content-forms">
      <button id="fillCurrentField">Fill Current Field</button>
      <button id="fillAllFields">Fill All Fields</button>
    </div>

    <div class="tab-content" id="content-session">
      <div id="sessionInfo" class="session-info">
        <div class="no-session">No active form session</div>
      </div>

      <div class="session-actions">
        <button id="newSession" class="small-button">New Session</button>
        <button id="endSession" class="small-button" disabled>End Session</button>
        <button id="viewSessions" class="small-button">View All</button>
      </div>
    </div>

    <div id="status"></div>

    <div class="separator"></div>

    <div class="settings-link">
      <a href="#" id="openSettings">Settings</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
