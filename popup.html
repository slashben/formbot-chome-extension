<!DOCTYPE html>
<html>
<head>
  <title>FormBot</title>
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      background-color: #4285f4;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #357ae8;
    }
    .settings-link {
      margin-top: 10px;
      text-align: center;
    }
    #status {
      margin-top: 10px;
      padding: 5px;
      border-radius: 4px;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>FormBot</h2>
    <button id="fillCurrentField">Fill Current Field</button>
    <button id="fillAllFields">Fill All Fields</button>
    <div id="status"></div>
    <div class="settings-link">
      <a href="#" id="openSettings">Settings</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
